name: Cipher CI (Linux/macOS/Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo quality gates (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cipher-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: cipher-linux-arm64
          - os: macos-13
            asset: cipher-macos-x86_64
          - os: macos-14
            asset: cipher-macos-arm64
          - os: windows-latest
            asset: cipher-windows-x86_64.exe
          - os: windows-11-arm
            asset: cipher-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.96.0)
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all-targets
        continue-on-error: ${{ startsWith(matrix.os, 'windows') }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: cipher-bin-${{ matrix.asset }}
          path: |
            target/release/cipher
            target/release/cipher.exe
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name cipher -o -name cipher.exe \) | while read f; do
            asset=$(echo "$f" | sed -E 's|artifacts/cipher-bin-([^/]+)/.*|\1|')
            cp "$f" "release/$asset"
          done
          chmod +x release/cipher-linux-* release/cipher-macos-* 2>/dev/null || true
          (cd release && sha256sum cipher-* > SHA256SUMS.txt)
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
